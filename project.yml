name: Palabra
options:
  bundleIdPrefix: dev.palabra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Palabra:
    type: application
    platform: iOS
    sources:
      - path: Palabra
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Palabra
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Palabra uses the camera to read a math problem from a photo. The photo is read by Gemini with your own API key; with no key it is read on your device.
        NSMicrophoneUsageDescription: Palabra listens when you answer a speaking question in an exam. Nothing is recorded or kept.
        NSSpeechRecognitionUsageDescription: Palabra uses speech recognition to check the Spanish word you say in an exam. It runs on your device when the phone supports it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.palabra.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  PalabraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PalabraTests
    dependencies:
      - target: Palabra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.palabra.tests
        GENERATE_INFOPLIST_FILE: YES
  PalabraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PalabraUITests
    dependencies:
      - target: Palabra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.palabra.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Palabra:
    build:
      targets:
        Palabra: all
    test:
      targets:
        - PalabraTests
        - PalabraUITests
