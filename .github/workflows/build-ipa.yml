name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The IPA job is independent of the test job, so a failing test never blocks the deliverable; the run itself still
  # turns red when any unit or UI test fails.
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive (unsigned)
        shell: bash
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Palabra.xcodeproj -scheme Palabra -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Palabra.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/archive.log | tail -n 40
      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          {
            echo "xcodebuild errors:"
            grep -E 'error:' build/archive.log | sed 's#/Users/runner/work/Palabra/Palabra/##' | awk '!seen[$0]++' | head -40
            echo "--- last 25 log lines:"
            tail -n 25 build/archive.log | sed 's#/Users/runner/work/Palabra/Palabra/##'
          } > build/errors.txt
          MSG=$(python3 -c "print(open('build/errors.txt').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Archive errors::$MSG"
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Palabra.xcarchive/Products/Applications/Palabra.app Payload/
          zip -qry build/Palabra-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Palabra-unsigned-ipa
          path: build/Palabra-unsigned.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: archive-log
          path: build/archive.log

  tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Tool versions
        run: |
          xcodebuild -version
          xcodegen --version
      - name: Check conventions
        run: bash scripts/check-conventions.sh
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = sorted((rt, x['udid']) for rt, ds in d.items() if 'iOS' in rt for x in ds if x['name'].startswith('iPhone'))
          print(c[-1][1])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p build
          # No secrets here: only the live smoke test below gets the API key.
          xcodebuild test -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:PalabraTests -skip-testing:PalabraTests/LiveSmokeTests \
            -resultBundlePath build/unit.xcresult \
            | tee build/unit.log | tail -n 80
      - name: Live smoke test
        shell: bash
        env:
          TEST_RUNNER_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          xcodebuild test -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:PalabraTests/LiveSmokeTests \
            -resultBundlePath build/live.xcresult \
            | tee -a build/unit.log | tail -n 40
      - name: Surface unit-test failures as annotations
        if: failure()
        shell: bash
        run: |
          # CoreData/simulator logging is extremely noisy; drop it so real failures show.
          grep -v 'CoreData:' build/unit.log > build/unit-clean.log || true
          {
            echo "Unit test failures:"
            grep -E "Test Case .* failed|Failing tests|TEST FAILED|TEST EXECUTE FAILED|Crash|crashed|timed out|Executed [0-9]+ tests|XCTAssert|: error: -\\[|: error:" build/unit-clean.log | sed 's#/Users/runner/work/Palabra/Palabra/##' | awk '!seen[$0]++' | head -60 || true
            echo "--- last 40 log lines (CoreData noise removed):"
            tail -n 40 build/unit-clean.log | cut -c1-300 | sed 's#/Users/runner/work/Palabra/Palabra/##' || true
          } > build/unit-errors.txt || true
          MSG=$(python3 -c "print(open('build/unit-errors.txt').read().replace('%','%25').replace('\\r','%0D').replace('\\n','%0A'))")
          echo "::error title=Unit test errors::$MSG"
      - name: Unit test summary
        if: always()
        shell: bash
        run: |
          # One line per suite (passed/failed counts), so the result is readable without downloading logs.
          {
            echo "## Unit test suites"
            grep -E "^Test Suite '[A-Za-z]+Tests' (passed|failed)" build/unit.log | sed -E "s/ at [0-9-]+ [0-9:.]+\.?//" | awk '!seen[$0]++'
            echo "passed cases: $(grep -cE "^Test Case .* passed" build/unit.log)  failed cases: $(grep -cE "^Test Case .* failed" build/unit.log)"
          } | tee build/unit-summary.txt >> "$GITHUB_STEP_SUMMARY" || true
          MSG=$(python3 -c "print(open('build/unit-summary.txt').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=Unit test summary::$MSG"
      - name: UI tests
        # Runs even after a unit failure, and fails the job when a UI test fails (the summary steps below still run).
        if: always()
        shell: bash
        run: |
          xcodebuild test -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:PalabraUITests -resultBundlePath build/ui.xcresult \
            | tee build/ui.log | tail -n 80
      - name: UI test summary
        if: always()
        shell: bash
        run: |
          # Say plainly what happened (logs are not downloadable).
          grep -v 'CoreData:' build/ui.log > build/ui-clean.log || true
          {
            echo "UI tests: passed cases: $(grep -cE "^Test Case .* passed" build/ui-clean.log)  failed cases: $(grep -cE "^Test Case .* failed" build/ui-clean.log)"
            grep -E "Test Case .* failed|TEST FAILED|TEST EXECUTE FAILED|: error:|XCTAssert|Failing tests|crashed|Executed [0-9]+ tests" build/ui-clean.log | sed 's#/Users/runner/work/Palabra/Palabra/##' | cut -c1-300 | awk '!seen[$0]++' | head -40 || true
            echo "--- last 25 log lines:"
            tail -n 25 build/ui-clean.log | cut -c1-240 || true
          } > build/ui-summary.txt || true
          MSG=$(python3 -c "print(open('build/ui-summary.txt').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=UI test summary::$MSG"
          # Why a lookup failed: the elements the app really showed at that moment (first four failures).
          python3 - <<'PY'
          import re
          lines = open('build/ui-clean.log', errors='replace').read().split('\n')
          shown = 0
          for i, line in enumerate(lines):
              if ('No matches found' in line or 'Failed to' in line) and ': error:' in line and shown < 4:
                  shown += 1
                  chunk = '\n'.join(l[:200] for l in lines[i:i + 45])
                  chunk = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=UI failure detail %d::%s' % (shown, chunk))
          PY
      - name: Export UI screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/unit.xcresult
            build/live.xcresult
            build/ui.xcresult
            build/screenshots
          retention-days: 14
