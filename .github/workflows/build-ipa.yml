name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The IPA job is independent of the test job, so a failing test never blocks the deliverable; the run itself still
  # turns red when any unit or UI test fails.
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive (unsigned)
        shell: bash
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Palabra.xcodeproj -scheme Palabra -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Palabra.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/archive.log | tail -n 40
      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          {
            echo "xcodebuild errors:"
            grep -E 'error:' build/archive.log | sed 's#/Users/runner/work/Palabra/Palabra/##' | awk '!seen[$0]++' | head -40
            echo "--- last 25 log lines:"
            tail -n 25 build/archive.log | sed 's#/Users/runner/work/Palabra/Palabra/##'
          } > build/errors.txt
          MSG=$(python3 -c "print(open('build/errors.txt').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Archive errors::$MSG"
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Palabra.xcarchive/Products/Applications/Palabra.app Payload/
          zip -qry build/Palabra-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Palabra-unsigned-ipa
          path: build/Palabra-unsigned.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: archive-log
          path: build/archive.log

  # The 3D scene (web/books3d) is built into one HTML file that the app bundles. Test it, rebuild it, and fail when the
  # committed bundle is not what the sources produce (so the app never ships a stale scene).
  scene:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/books3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/books3d/package-lock.json
      - run: npm ci
      - name: Scene tests
        run: npm test
      - name: Rebuild the bundle
        run: npm run build
      - name: Bundle is current
        working-directory: .
        run: git diff --exit-code -- Palabra/Resources/Books3D/books3d.html

  # Tests run as four parallel shards (plus the IPA job = the five macOS jobs a free account may run at once). Each shard builds
  # once (build-for-testing, no index store), boots the simulator while it builds, then runs its slice of the suites.
  # Shard "core" also runs every unit test and the live smoke test.
  tests:
    name: tests (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            unit: true
            ui: "LaunchUITests SmokeUITests PersistenceUITests VocabularyLibraryUITests"
          - name: books
            ui: "BooksUITests StudyUITests SolveUITests"
          - name: artifacts
            ui: "ArtifactsUITests ChatUITests"
          - name: exam
            ui: "ExamUITests ReviewUITests"
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Check conventions and lessons
        if: matrix.unit
        run: |
          bash scripts/check-conventions.sh
          python3 scripts/validate-lessons.py
      - name: Pick an iPhone simulator and boot it while building
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = sorted((rt, x['udid']) for rt, ds in d.items() if 'iOS' in rt for x in ds if x['name'].startswith('iPhone'))
          print(c[-1][1])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          (xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b) >/dev/null 2>&1 &
      - name: Build for testing
        shell: bash
        run: |
          mkdir -p build
          xcodebuild build-for-testing -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build/build.log | tail -n 20
      - name: Surface build errors as annotations
        if: failure()
        run: bash scripts/ci-summary.sh build/build.log "build (${{ matrix.name }})"
      - name: Tests
        id: tests
        shell: bash
        run: |
          # No secrets here: only the live smoke test below gets the API key.
          ARGS=""
          if [ "${{ matrix.unit }}" = "true" ]; then
            ARGS="-only-testing:PalabraTests -skip-testing:PalabraTests/LiveSmokeTests"
          fi
          for c in ${{ matrix.ui }}; do ARGS="$ARGS -only-testing:PalabraUITests/$c"; done
          xcodebuild test-without-building -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd \
            $ARGS -resultBundlePath build/tests.xcresult \
            | tee build/tests.log | tail -n 60
      - name: Test summary
        if: always()
        run: bash scripts/ci-summary.sh build/tests.log "tests (${{ matrix.name }})"
      - name: Live smoke test
        if: matrix.unit && always()
        shell: bash
        env:
          TEST_RUNNER_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          xcodebuild test-without-building -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd \
            -only-testing:PalabraTests/LiveSmokeTests \
            -resultBundlePath build/live.xcresult \
            | tee build/live.log | tail -n 40
      - name: Export screenshots of failures
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/tests.xcresult --output-path build/screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build/tests.xcresult
            build/live.xcresult
            build/screenshots
          retention-days: 14

  # A scripted walk through the Books tab with the simulator screen recorded, published on the ci-recordings branch.
  # Evidence, not a gate, and off the normal path: run it by hand (workflow_dispatch) or put [tour] in the commit message.
  tour:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tour]')
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = sorted((rt, x['udid']) for rt, ds in d.items() if 'iOS' in rt for x in ds if x['name'].startswith('iPhone'))
          print(c[-1][1])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Record the tour
        continue-on-error: true
        shell: bash
        env:
          TEST_RUNNER_TOUR_DIR: ${{ github.workspace }}/build/tour
        run: |
          set +e +o pipefail
          mkdir -p build/tour
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" 2>/dev/null
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/tour/tour.mp4 > build/rec.log 2>&1 &
          REC=$!
          sleep 3
          xcodebuild test -project Palabra.xcodeproj -scheme Palabra \
            -destination "id=$UDID" COMPILER_INDEX_STORE_ENABLE=NO \
            -only-testing:PalabraUITests/BooksTourUITests -resultBundlePath build/tour.xcresult \
            > build/tour.log 2>&1
          echo "xcodebuild exit code: $?" > build/tour/result.txt
          sleep 2
          kill -INT $REC 2>/dev/null
          wait $REC 2>/dev/null
          grep -v 'CoreData:' build/tour.log | tail -n 120 > build/tour/xcodebuild-tail.log
          ls -la build/tour | head -60
          exit 0
      - name: Publish the tour
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d build/tour ] || { echo "::warning title=tour::no build/tour directory"; exit 0; }
          cd build/tour
          printf 'commit %s\nrun %s\n' "${{ github.sha }}" "${{ github.run_id }}" > meta.txt
          git init -q -b ci-recordings
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Books tour: run ${{ github.run_id }}, commit ${{ github.sha }}"
          OUT=$(git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-recordings 2>&1 | tail -5)
          echo "::notice title=tour publish::$(echo "$OUT" | tr '\n' ' ' | sed "s/${GH_TOKEN}/***/g")"
          echo "files: $(ls | tr '\n' ' ')"
