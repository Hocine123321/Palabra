name: Mirror

on:
  push:
    branches: [main]
    paths: ["worker/**", "web/**", ".github/workflows/mirror.yml", "PalabraTests/Mirroring/Fixtures/**"]
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        run: npm ci
        working-directory: worker
      - name: Build the web app
        run: npm --prefix web run build
      - name: Web tests
        run: npm --prefix web test
      - name: Worker tests
        run: npm --prefix worker test
      - name: Bundle check (wrangler dry run)
        run: npm --prefix worker run check
