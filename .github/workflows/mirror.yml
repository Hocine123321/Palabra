name: Mirror

on:
  push:
    branches: [main]
    paths: ["worker/**", "web/**", ".github/workflows/mirror.yml", "PalabraTests/Mirroring/Fixtures/**"]
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        run: npm ci
        working-directory: worker
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build the web app
        run: npm --prefix web run build
      - name: Verify protocol vectors independently (Python)
        run: |
          pip install cryptography
          node web/scripts/make-vectors.mjs
          git diff --exit-code PalabraTests/Mirroring/Fixtures/mirror-vectors.json
          python3 web/scripts/verify-vectors.py
      - name: Web tests
        run: npm --prefix web test
      - name: Worker tests
        run: npm --prefix worker test
      - name: Bundle check (wrangler dry run)
        run: npm --prefix worker run check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Note when the deploy is skipped
        if: env.HAS_CF != 'true'
        run: echo "Cloudflare secrets are not set, so the Worker was not deployed. See docs/features/mirroring.md." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22
      - name: Install worker dependencies
        if: env.HAS_CF == 'true'
        run: npm ci
        working-directory: worker
      - name: Install web dependencies
        if: env.HAS_CF == 'true'
        run: npm ci
        working-directory: web
      - name: Build the web app
        if: env.HAS_CF == 'true'
        run: npm --prefix web run build
      - name: Deploy the Worker
        if: env.HAS_CF == 'true'
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Smoke test the deployed Worker
        if: env.HAS_CF == 'true'
        run: |
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' worker/deploy.log | head -n 1)
          if [ -z "$url" ]; then echo "No workers.dev address in the deploy output" >&2; exit 1; fi
          node worker/scripts/smoke.mjs "$url"
          echo "Mirror Worker deployed and checked: $url" >> "$GITHUB_STEP_SUMMARY"
