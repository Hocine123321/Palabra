name = "palabra-mirror"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "MIRROR"
class_name = "Mirror"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mirror", "Gate"]
